services:
  bot:
    build: .
    image: archipelabot
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "38281-38300:38281-38300"  # games hosted by the bot (/partie lancer): same range as HOST_PORTS
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
